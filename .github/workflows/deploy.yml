name: CI/CD Pipeline - Docker Build, Push & Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

env:
  IMAGE_NAME: primeinfrastudio-backend
  CONTAINER_NAME: primeinfrastudio-backend
  PORT: 5000

jobs:
  # ==========================================
  # JOB 1: Build Docker image & Push to Docker Hub
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: SSH into AWS EC2 (t3.micro) & Deploy
  # ==========================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "==== Log in to Docker Hub on EC2 ===="
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "==== Pulling latest Docker image ===="
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==== Stopping and removing old container ===="
            if [ "$(docker ps -aq -f name=${{ env.CONTAINER_NAME }})" ]; then
              docker stop ${{ env.CONTAINER_NAME }} || true
              docker rm -f ${{ env.CONTAINER_NAME }} || true
            fi

            echo "==== Ensuring persistent directories exist ===="
            mkdir -p /home/${{ secrets.EC2_USER }}/uploads

            echo "==== Running updated container on EC2 ===="
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p ${{ env.PORT }}:${{ env.PORT }} \
              --memory="750m" \
              --env-file /home/${{ secrets.EC2_USER }}/.env \
              -v /home/${{ secrets.EC2_USER }}/uploads:/app/uploads \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==== Cleaning up unused dangling Docker images ===="
            docker image prune -af --filter "until=24h"

            echo "==== Deployment Status ===="
            docker ps -f name=${{ env.CONTAINER_NAME }}
